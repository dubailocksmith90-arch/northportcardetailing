[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "http://northportcardetailing.com/*"
  to = "https://www.northportcardetailing.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.northportcardetailing.com/*"
  to = "https://www.northportcardetailing.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://northportcardetailing.com/*"
  to = "https://www.northportcardetailing.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
